[package]
name = "hmacfr-desktop"
version = "1.0.0"
description = "HMACFR Digital Forensics & Evidence Preservation Framework Desktop Shell"
authors = ["HMACFR Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
